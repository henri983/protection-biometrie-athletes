[project]
name = "protection-biometrie-athletes"
version = "1.0.0"
description = "Plateforme de sécurisation et gouvernance des données biométriques des athlètes avec détection IA des accès anormaux"
authors = [{ name = "henri983", email = "henrinyame2001@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: Tests unitaires",
    "ai: Tests du moteur IA de détection d'accès anormal",
    "integration: Tests d'intégration API",
    "security: Tests de résistance et conformité sécurité",
]
